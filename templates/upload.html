<!DOCTYPE html>
<html>

<head>

    <title>Upload Paper - PaperGuard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

    <h1>Upload Exam Paper</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST"
          enctype="multipart/form-data">

        <label>
            Exam Paper Title
        </label>

        <input
            type="text"
            name="title"
            placeholder="Example: DBMS Internal Examination"
            required
        >

        <label>
            Assign Faculty
        </label>

        <select
            name="assigned_to"
            required
        >

            <option value="">
                Select Faculty
            </option>

            {% for faculty in faculty_members %}

            <option value="{{ faculty['id'] }}">
                {{ faculty['username'] }}
            </option>

            {% endfor %}

        </select>

        <label>
            Exam Paper PDF
        </label>

        <input
            type="file"
            name="paper"
            accept=".pdf"
            required
        >

        <button type="submit">
            Encrypt & Upload
        </button>

    </form>

    <br>

    <a href="{{ url_for('main.dashboard') }}">
        Back to Dashboard
    </a>

</div>

</body>

</html>
